<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Offday System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d0d0d;
            background-image: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url('https://demigod-assets.sgp1.cdn.digitaloceanspaces.com/bgassets/goltogel.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #facc15;
        }
        .font-digital { font-family: 'Share Tech Mono', monospace; }
        
        @keyframes rotateNeon {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .neon-border-wrapper {
            position: relative;
            border-radius: 0.75rem;
            padding: 2px;
            background: linear-gradient(60deg, #facc15, #854d0e, #facc15, #713f12, #facc15);
            background-size: 300% 300%;
            animation: rotateNeon 6s ease infinite;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
        }

        .neon-content {
            background: rgba(15, 15, 15, 0.95);
            border-radius: calc(0.75rem - 2px);
        }

        .neon-text {
            color: #facc15;
            text-shadow: 0 0 8px rgba(250, 204, 21, 0.6);
        }
        .neon-input {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #facc15;
            color: #facc15;
        }
        .neon-input:focus {
            outline: none;
            box-shadow: 0 0 10px #facc15;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) hue-rotate(30deg) brightness(1.5);
            cursor: pointer;
            transform: scale(1.2);
        }
        .neon-btn {
            background: #facc15;
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
            transition: all 0.2s ease;
        }
        .neon-btn:hover {
            background: #fef08a;
            box-shadow: 0 0 20px #facc15;
        }
    </style>
</head>
<body class="min-h-screen font-sans">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <header class="mb-8 text-center">
            <div class="neon-border-wrapper mb-4">
                <div class="neon-content px-6 py-2 flex justify-between items-center text-sm font-digital">
                    <div>MODE: <span class="text-white font-bold">STAFF PORTAL</span></div>
                    <div class="neon-text"><span id="digitalClock">00:00:00</span> &bull; <span id="digitalDate">--/--/----</span></div>
                    <div><a href="admin.html" class="text-yellow-300 hover:underline">Masuk Admin &rarr;</a></div>
                </div>
            </div>
            
            <h1 class="text-3xl font-bold font-digital tracking-wide neon-text">PENGAJUAN OFFDAY STAFF</h1>
            <p class="text-yellow-200/80 font-medium mt-1 font-digital text-sm">ATURAN: 1 ORANG PAGI & 1 ORANG MALAM PER DIVISI | JEDA MINIMAL 7 HARI | CS & KAPTEN PAGI TIDAK BISA HARI KAMIS</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Form Input Staff -->
            <div class="lg:col-span-1">
                <div class="neon-border-wrapper sticky top-6">
                    <div class="neon-content p-6">
                        <h2 class="text-base font-bold mb-4 font-digital tracking-wide neon-text">FORM PENGAJUAN ANDA</h2>
                        <form id="offdayForm" class="space-y-4 font-digital">
                            <div>
                                <label class="block text-xs font-bold mb-1">DIVISI</label>
                                <select id="divisi" required class="w-full px-3 py-2 rounded-lg neon-input text-sm" onchange="updateKaryawanList()">
                                    <option value="" class="bg-black">Pilih Divisi</option>
                                    <option value="CS" class="bg-black">Customer Service (CS)</option>
                                    <option value="KAPTEN" class="bg-black">Kapten</option>
                                    <option value="KASIR" class="bg-black">Kasir</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-bold mb-1">NAMA KARYAWAN</label>
                                <select id="nama" required class="w-full px-3 py-2 rounded-lg neon-input text-sm">
                                    <option value="" class="bg-black">Pilih Divisi Terlebih Dahulu</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-bold mb-1">TANGGAL OFFDAY</label>
                                <input type="date" id="tanggal" required class="w-full px-3 py-2 rounded-lg neon-input text-sm cursor-pointer">
                            </div>

                            <div>
                                <label class="block text-xs font-bold mb-1">SHIFT</label>
                                <select id="shift" required class="w-full px-3 py-2 rounded-lg neon-input text-sm">
                                    <option value="" class="bg-black">Pilih Shift</option>
                                    <option value="Pagi" class="bg-black">Pagi (Maks. 1 Orang / Divisi)</option>
                                    <option value="Malam" class="bg-black">Malam (Maks. 1 Orang / Divisi)</option>
                                </select>
                            </div>

                            <button type="submit" class="w-full py-2.5 px-4 rounded-lg neon-btn tracking-wider uppercase text-sm">
                                AJUKAN OFFDAY
                            </button>
                        </form>
                        <div id="alertBox" class="mt-4 hidden p-3 rounded-lg text-sm font-digital"></div>
                    </div>
                </div>
            </div>

            <!-- Tabel Jadwal Staff (Tanpa Hapus) -->
            <div class="lg:col-span-2 space-y-6">
                <div class="neon-border-wrapper">
                    <div class="neon-content p-4 flex items-center justify-between font-digital">
                        <div class="flex items-center gap-2 w-full">
                            <label class="text-xs font-bold">FILTER DIVISI:</label>
                            <select id="filterDivisi" class="px-3 py-1.5 rounded-lg text-sm neon-input" onchange="renderTable()">
                                <option value="ALL" class="bg-black">Semua Divisi</option>
                                <option value="CS" class="bg-black">CS</option>
                                <option value="KAPTEN" class="bg-black">KAPTEN</option>
                                <option value="KASIR" class="bg-black">KASIR</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="neon-border-wrapper">
                    <div class="neon-content overflow-hidden">
                        <div class="px-6 py-4 border-b border-yellow-500/30">
                            <h2 class="text-base font-bold font-digital tracking-wide neon-text">JADWAL OFFDAY TERSIMPAN</h2>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-yellow-500/10 text-yellow-300 text-xs font-bold font-digital tracking-wider border-b border-yellow-500/30">
                                        <th class="px-6 py-3">TANGGAL</th>
                                        <th class="px-6 py-3">DIVISI</th>
                                        <th class="px-6 py-3">SHIFT PAGI (1/1)</th>
                                        <th class="px-6 py-3">SHIFT MALAM (1/1)</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody" class="divide-y divide-yellow-500/20 text-sm font-digital">
                                    <!-- Data Firebase -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCoYy_QgZ4i7NeWHkLGhcicJRDFEITzxLM",
            authDomain: "offday-cebb2.firebaseapp.com",
            databaseURL: "https://offday-cebb2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "offday-cebb2",
            storageBucket: "offday-cebb2.firebasestorage.app",
            messagingSenderId: "700101138134",
            appId: "1:700101138134:web:6b952e04c91d20287ddb77",
            measurementId: "G-42TCRY5BSH"
        };

        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        function updateClock() {
            const now = new Date();
            document.getElementById('digitalClock').textContent = 
                String(now.getHours()).padStart(2, '0') + ':' + 
                String(now.getMinutes()).padStart(2, '0') + ':' + 
                String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('digitalDate').textContent = 
                String(now.getDate()).padStart(2, '0') + '/' + 
                String(now.getMonth() + 1).padStart(2, '0') + '/' + 
                now.getFullYear();
        }
        setInterval(updateClock, 1000);
        updateClock();

        const karyawanData = {
            "CS": [
                "ANDRE WELLYANTO", "MARTIN PANGKAWIRA", "DICKY WIJAYA", 
                "MUHAMMAD RAMADAN HUTAGALUNG", "JEKI SYAHPUTRA GINTING", 
                "AISYATUN MUKARROMAH", "PANI PRADENKA", "BILKIS ARI ADI NANTA", 
                "IDRIS", "RONI HARI ANAN", "MUHAMMAD AGUS SALIM", 
                "HABI RAHMAD", "SANDRES MUDA MANIK", "ANDRE NOVELA", 
                "AGUS ANGGARA SANJAYA DAMANIK"
            ],
            "KAPTEN": [
                "ICHA ANANDA ISFI", "RAFLI RINALDI", "GUSTI IRWANDA", "OKI SAN JAYA"
            ],
            "KASIR": [
                "MUHAMMAD ZULFA", "DANIEL SIAHAAN", "DIAN SYAHPUTRA", 
                "OKTO SURYADI", "WENINA ALEXANDRA HUTABARAT", "AKASH VIKNESH", 
                "WILIA ANANDA", "PUTRI NAZWA NASUTION", "IRFAN ROSANDY NASUTION", 
                "ADITYA NUGROHO", "AKAS SUWADEN", "BULAN MEI YANTI", 
                "RATNA SARI", "YUSUF RAHMAN", "YURIKA NASYIWA", 
                "ALDINO FAJAR", "MESTIKA SAFITRI SIMBOLON"
            ]
        };

        let offdayData = {};
        const form = document.getElementById('offdayForm');
        const divisiSelect = document.getElementById('divisi');
        const namaSelect = document.getElementById('nama');
        const alertBox = document.getElementById('alertBox');
        const tableBody = document.getElementById('tableBody');
        const filterDivisi = document.getElementById('filterDivisi');

        rtdb.ref('offdayData_v5').on('value', (snapshot) => {
            offdayData = snapshot.val() || {};
            renderTable();
        });

        function updateKaryawanList() {
            const selectedDivisi = divisiSelect.value;
            namaSelect.innerHTML = '<option value="" class="bg-black">Pilih Karyawan</option>';
            if (selectedDivisi && karyawanData[selectedDivisi]) {
                karyawanData[selectedDivisi].forEach(nama => {
                    const option = document.createElement('option');
                    option.value = nama;
                    option.textContent = nama;
                    option.className = "bg-black";
                    namaSelect.appendChild(option);
                });
            }
        }

        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.classList.remove('hidden', 'bg-red-950', 'text-red-300', 'bg-green-950', 'text-green-300');
            if (type === 'error') {
                alertBox.classList.add('bg-red-950', 'text-red-300', 'border', 'border-red-500');
            } else {
                alertBox.classList.add('bg-green-950', 'text-green-300', 'border', 'border-green-500');
            }
            setTimeout(() => { alertBox.classList.add('hidden'); }, 5000);
        }

        function renderTable() {
            tableBody.innerHTML = '';
            const filter = filterDivisi.value;
            const dates = Object.keys(offdayData).sort();
            let rowsToDisplay = [];

            dates.forEach(tanggal => {
                const divisions = Object.keys(offdayData[tanggal]);
                divisions.forEach(divisi => {
                    if (filter === 'ALL' || filter === divisi) {
                        const dataDiv = offdayData[tanggal][divisi];
                        if (dataDiv.Pagi || dataDiv.Malam) {
                            rowsToDisplay.push({ tanggal, divisi, Pagi: dataDiv.Pagi, Malam: dataDiv.Malam });
                        }
                    }
                });
            });

            if (rowsToDisplay.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="px-6 py-6 text-center text-yellow-500/60">BELUM ADA DATA OFFDAY YANG TERCATAT.</td></tr>`;
                return;
            }

            rowsToDisplay.forEach(item => {
                const tr = document.createElement('tr');
                let html = `<td class="px-6 py-4 font-bold text-white">${item.tanggal}</td>`;
                html += `<td class="px-6 py-4"><span class="px-2.5 py-0.5 rounded text-xs font-bold bg-yellow-500/20 text-yellow-300 border border-yellow-500/40">${item.divisi}</span></td>`;
                html += item.Pagi ? `<td class="px-6 py-4"><span class="px-2 py-0.5 rounded text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40">${item.Pagi}</span></td>` : `<td class="px-6 py-4 text-yellow-500/40 italic text-xs">KOSONG</td>`;
                html += item.Malam ? `<td class="px-6 py-4"><span class="px-2 py-0.5 rounded text-xs font-bold bg-yellow-600/20 text-yellow-200 border border-yellow-600/40">${item.Malam}</span></td>` : `<td class="px-6 py-4 text-yellow-500/40 italic text-xs">KOSONG</td>`;
                tr.innerHTML = html;
                tableBody.appendChild(tr);
            });
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const divisi = divisiSelect.value;
            const nama = namaSelect.value;
            const tanggalInput = document.getElementById('tanggal').value;
            const shift = document.getElementById('shift').value;
            const targetDate = new Date(tanggalInput);

            const dayOfWeek = targetDate.getDay(); 
            if (dayOfWeek === 4 && shift === 'Pagi' && (divisi === 'CS' || divisi === 'KAPTEN')) {
                showAlert(`GAGAL! Divisi ${divisi} untuk Shift Pagi TIDAK BISA mengambil offday di hari Kamis.`);
                return;
            }

            if (!offdayData[tanggalInput]) {
                offdayData[tanggalInput] = {
                    "CS": { Pagi: null, Malam: null },
                    "KAPTEN": { Pagi: null, Malam: null },
                    "KASIR": { Pagi: null, Malam: null }
                };
            }

            if (offdayData[tanggalInput][divisi][shift] !== null) {
                showAlert(`GAGAL! SHIFT ${shift} UNTUK DIVISI ${divisi} PADA TANGGAL ${tanggalInput} SUDAH DIISI OLEH ${offdayData[tanggalInput][divisi][shift]}.`);
                return;
            }

            for (let tgl in offdayData) {
                let currentDivs = offdayData[tgl];
                for (let d in currentDivs) {
                    let bookedName = null;
                    if (currentDivs[d].Pagi === nama) bookedName = currentDivs[d].Pagi;
                    if (currentDivs[d].Malam === nama) bookedName = currentDivs[d].Malam;

                    if (bookedName) {
                        let existingDate = new Date(tgl);
                        let diffDays = Math.round((targetDate - existingDate) / (1000 * 60 * 60 * 24));

                        if (diffDays === 0) {
                            showAlert(`GAGAL! ${nama} SUDAH TERDAFTAR OFFDAY PADA TANGGAL ${tanggalInput}.`);
                            return;
                        }
                        if (Math.abs(diffDays) < 8) {
                            showAlert(`GAGAL! ${nama} BARU SAJA OFFDAY PADA TANGGAL ${tgl}. JEDA MINIMAL 8 HARI.`);
                            return;
                        }
                    }
                }
            }

            offdayData[tanggalInput][divisi][shift] = nama;

            rtdb.ref('offdayData_v5').set(offdayData, (error) => {
                if (error) {
                    showAlert("Gagal mengirim pengajuan!");
                } else {
                    showAlert(`BERHASIL! PENGAJUAN OFFDAY SHIFT ${shift} (${divisi}) DISIMPAN.`, 'success');
                    form.reset();
                    namaSelect.innerHTML = '<option value="" class="bg-black">Pilih Divisi Terlebih Dahulu</option>';
                }
            });
        });

        renderTable();
    </script>
</body>
</html>
