<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Staff - Pengajuan Offday & Cuti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090a0f;
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('https://demigod-assets.sgp1.cdn.digitaloceanspaces.com/bgassets/goltogel.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .font-mono-code { font-family: 'JetBrains Mono', monospace; }
        .card-container {
            background: rgba(12, 14, 20, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(250, 204, 21, 0.25);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
        }
        .input-pro {
            background: rgba(8, 9, 13, 0.85);
            border: 1px solid rgba(250, 204, 21, 0.3);
            color: #f8fafc;
            transition: all 0.25s ease;
        }
        .input-pro:focus {
            outline: none;
            border-color: #facc15;
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.2);
        }
        .btn-pro {
            background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%);
            color: #090a0f;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .btn-pro:hover {
            filter: brightness(1.1);
            box-shadow: 0 4px 15px rgba(250, 204, 21, 0.35);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(9, 10, 15, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(250, 204, 21, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(250, 204, 21, 0.5); }
    </style>
</head>
<body class="antialiased p-4 lg:p-6">

    <div class="max-w-[1700px] mx-auto">
        <!-- Top Status Bar -->
        <div class="card-container rounded-xl px-6 py-4 mb-6 flex justify-between items-center flex-wrap gap-4">
            <div class="flex items-center space-x-3">
                <span class="w-3 h-3 bg-yellow-400 rounded-full animate-pulse"></span>
                <span class="text-xs font-mono-code tracking-wider text-yellow-400 uppercase font-bold">PORTAL STAFF - PENGAJUAN OFFDAY & CUTI</span>
            </div>
            <div>
        </div>

        <!-- PANEL STAFF -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Kontrol Staff (Kiri) -->
            <div class="lg:col-span-1">
                <div class="card-container rounded-xl p-5 font-mono-code sticky top-6">
                    <h2 class="text-xs font-bold tracking-wider text-yellow-400 uppercase mb-4 pb-2 border-b border-yellow-500/20">FORM PENGAJUAN STAFF</h2>
                    
                    <div class="space-y-4 text-xs">
                        <div>
                            <label class="block font-semibold mb-1 text-yellow-400/90 tracking-wide uppercase text-[11px]">PILIH DIVISI</label>
                            <select id="staffDivisiLogin" class="w-full px-3 py-2.5 rounded-lg input-pro text-xs" onchange="updateStaffNamaLogin()">
                                <option value="" class="bg-slate-900">-- Pilih Divisi --</option>
                                <option value="CS" class="bg-slate-900">Customer Service (CS)</option>
                                <option value="KAPTEN" class="bg-slate-900">Kapten</option>
                                <option value="KASIR" class="bg-slate-900">Kasir</option>
                            </select>
                        </div>

                        <div>
                            <label class="block font-semibold mb-1 text-yellow-400/90 tracking-wide uppercase text-[11px]">PILIH NAMA ANDA</label>
                            <select id="staffNamaLogin" class="w-full px-3 py-2.5 rounded-lg input-pro text-xs" onchange="onStaffSelected()">
                                <option value="" class="bg-slate-900">-- Pilih Nama Staff --</option>
                            </select>
                        </div>

                        <div id="staffControlGroup" class="hidden space-y-4 pt-2 border-t border-yellow-500/20">
                            <div>
                                <label class="block font-semibold mb-1 text-yellow-400/90 tracking-wide uppercase text-[11px]">JENIS PENGAJUAN</label>
                                <select id="staffJenisReq" class="w-full px-3 py-2.5 rounded-lg input-pro text-xs" onchange="toggleFormInputType()">
                                    <option value="Offday" class="bg-slate-900">Pengajuan Offday (Maks. 2x/Bulan)</option>
                                    <option value="Cuti" class="bg-slate-900">Pengajuan Cuti (Otomatis Full Kuota)</option>
                                </select>
                            </div>

                            <div id="containerTanggalTunggal">
                                <label class="block font-semibold mb-1 text-yellow-400/90 tracking-wide uppercase text-[11px]">TANGGAL OFFDAY</label>
                                <input type="date" id="staffTanggalReq" class="w-full px-3 py-2.5 rounded-lg input-pro text-xs cursor-pointer">
                                <p class="text-[10px] text-yellow-400/80 mt-1.5 leading-relaxed">Info: Offday hanya bulan berjalan & tgl 8 s.d 29.</p>
                            </div>

                            <div id="containerCutiRange" class="hidden space-y-3">
                                <div>
                                    <label class="block font-semibold mb-1 text-yellow-400/90 tracking-wide uppercase text-[11px]">TANGGAL MULAI CUTI</label>
                                    <input type="date" id="staffCutiMulai" class="w-full px-3 py-2.5 rounded-lg input-pro text-xs cursor-pointer">
                                </div>
                                <div>
                                    <label class="block font-semibold mb-1 text-yellow-400/90 tracking-wide uppercase text-[11px]">JUMLAH HARI CUTI (OTOMATIS)</label>
                                    <input type="number" id="staffCutiJumlahHari" readonly class="w-full px-3 py-2.5 rounded-lg input-pro text-xs bg-slate-950 text-yellow-400 font-bold cursor-not-allowed">
                                    <p id="infoKuotaCuti" class="text-[10px] text-yellow-400/80 mt-1.5 leading-relaxed">Kuota Otomatis: CS/Kapten 14 Hari, Kasir 12 Hari.</p>
                                </div>
                            </div>

                            <button type="button" onclick="submitStaffRequest()" class="w-full py-3 px-4 rounded-lg btn-pro uppercase text-xs tracking-wider shadow mt-2">
                                KIRIM PENGAJUAN
                            </button>
                        </div>
                    </div>

                    <div id="staffAlertBox" class="mt-4 hidden p-3 rounded-lg text-xs leading-relaxed font-mono-code"></div>
                </div>
            </div>

            <!-- Rekapitulasi Staff (Kanan) -->
            <div class="lg:col-span-3">
                <div class="card-container rounded-xl p-5">
                    <div class="flex flex-wrap items-center justify-between gap-4 mb-5 pb-4 border-b border-yellow-500/20 font-mono-code">
                        <div class="flex items-center space-x-3">
                            <span class="text-xs font-bold text-yellow-400 tracking-wider uppercase">REKAPITULASI SHIFT & STATUS BULANAN</span>
                        </div>
                        <div>
                            <label class="block text-[10px] font-semibold text-slate-400 uppercase mb-1">PERIODE BULAN:</label>
                            <input type="month" id="staffFilterBulan" class="px-3 py-1.5 rounded-lg input-pro text-xs font-mono-code" onchange="renderStaffSchedule()">
                        </div>
                    </div>

                    <div class="overflow-x-auto min-h-[400px]">
                        <table id="staffScheduleTable" class="w-full text-center border-collapse text-xs whitespace-nowrap font-mono-code">
                            <!-- Rendered via JS -->
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCoYy_QgZ4i7NeWHkLGhcicJRDFEITzxLM",
            authDomain: "offday-cebb2.firebaseapp.com",
            databaseURL: "https://offday-cebb2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "offday-cebb2",
            storageBucket: "offday-cebb2.firebasestorage.app",
            messagingSenderId: "700101138134",
            appId: "1:700101138134:web:6b952e04c91d20287ddb77",
            measurementId: "G-42TCRY5BSH"
        };

        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        const now = new Date();
        const currentYearMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('staffFilterBulan').value = currentYearMonth;

        const karyawanData = {
            "CS": [
                "ANDRE WELLYANTO", "MARTIN PANGKAWIRA", "DICKY WIJAYA", 
                "MUHAMMAD RAMADAN HUTAGALUNG", "JEKI SYAHPUTRA GINTING", 
                "AISYATUN MUKARROMAH", "PANI PRADENKA", "BILKIS ARI ADI NANTA", 
                "IDRIS", "RONI HARI ANAN", "MUHAMMAD AGUS SALIM", 
                "HABI RAHMAD", "SANDRES MUDA MANIK", "ANDRE NOVELA", 
                "AGUS ANGGARA SANJAYA DAMANIK"
            ],
            "KAPTEN": [
                "ICHA ANANDA ISFI", "RAFLI RINALDI", "GUSTI IRWANDA", "OKI SAN JAYA"
            ],
            "KASIR": [
                "MUHAMMAD ZULFA", "DANIEL SIAHAAN", "DIAN SYAHPUTRA", 
                "OKTO SURYADI", "WENINA ALEXANDRA HUTABARAT", "AKASH VIKNESH", 
                "WILIA ANANDA", "PUTRI NAZWA NASUTION", "IRFAN ROSANDY NASUTION", 
                "ADITYA NUGROHO", "AKAS SUWADEN", "BULAN MEI YANTI", 
                "RATNA SARI", "YUSUF RAHMAN", "YURIKA NASYIWA", 
                "ALDINO FAJAR", "MESTIKA SAFITRI SIMBOLON"
            ]
        };

        let offdayData = {};
        let shiftStartData = {}; 

        rtdb.ref('offdayData_v7').on('value', (snapshot) => {
            offdayData = snapshot.val() || {};
            renderStaffSchedule();
        });

        rtdb.ref('shiftStart_v7').on('value', (snapshot) => {
            shiftStartData = snapshot.val() || {};
            renderStaffSchedule();
        });

        const staffDivisiLogin = document.getElementById('staffDivisiLogin');
        const staffNamaLogin = document.getElementById('staffNamaLogin');
        const staffControlGroup = document.getElementById('staffControlGroup');
        const staffJenisReq = document.getElementById('staffJenisReq');
        const containerTanggalTunggal = document.getElementById('containerTanggalTunggal');
        const containerCutiRange = document.getElementById('containerCutiRange');
        const staffTanggalReq = document.getElementById('staffTanggalReq');
        const staffCutiMulai = document.getElementById('staffCutiMulai');
        const staffCutiJumlahHari = document.getElementById('staffCutiJumlahHari');
        const infoKuotaCuti = document.getElementById('infoKuotaCuti');
        const staffAlertBox = document.getElementById('staffAlertBox');
        const staffFilterBulan = document.getElementById('staffFilterBulan');
        const staffScheduleTable = document.getElementById('staffScheduleTable');

        function updateStaffNamaLogin() {
            const div = staffDivisiLogin.value;
            staffNamaLogin.innerHTML = '<option value="">-- Pilih Nama Staff --</option>';
            if (div && karyawanData[div]) {
                karyawanData[div].forEach(nama => {
                    const opt = document.createElement('option');
                    opt.value = nama;
                    opt.textContent = nama;
                    opt.className = "bg-slate-900";
                    staffNamaLogin.appendChild(opt);
                });

                if (div === 'CS' || div === 'KAPTEN') {
                    staffCutiJumlahHari.value = 14;
                    infoKuotaCuti.textContent = "Kuota Cuti Divisi " + div + " Otomatis Terisi: 14 Hari.";
                } else {
                    staffCutiJumlahHari.value = 12;
                    infoKuotaCuti.textContent = "Kuota Cuti Divisi Kasir Otomatis Terisi: 12 Hari.";
                }
            }
            onStaffSelected();
        }

        function toggleFormInputType() {
            if (staffJenisReq.value === 'Offday') {
                containerTanggalTunggal.classList.remove('hidden');
                containerCutiRange.classList.add('hidden');
            } else {
                containerTanggalTunggal.classList.add('hidden');
                containerCutiRange.classList.remove('hidden');
            }
        }

        function onStaffSelected() {
            if (staffNamaLogin.value) staffControlGroup.classList.remove('hidden');
            else staffControlGroup.classList.add('hidden');
            renderStaffSchedule();
        }

        function showStaffAlert(msg, type = 'error') {
            staffAlertBox.textContent = msg;
            staffAlertBox.classList.remove('hidden', 'bg-red-950/80', 'text-red-300', 'border', 'border-red-600', 'bg-emerald-950/80', 'text-emerald-300', 'border-emerald-600');
            if (type === 'error') staffAlertBox.classList.add('bg-red-950/80', 'text-red-300', 'border', 'border-red-600');
            else staffAlertBox.classList.add('bg-emerald-950/80', 'text-emerald-300', 'border', 'border-emerald-600');
            setTimeout(() => { staffAlertBox.classList.add('hidden'); }, 6000);
        }

        function isHariTerakhirBulan(tanggalStr) {
            if (!tanggalStr) return false;
            let tgl = new Date(tanggalStr);
            let hariTerakhir = new Date(tgl.getFullYear(), tgl.getMonth() + 1, 0).getDate();
            return tgl.getDate() === hariTerakhir;
        }

        function getShiftStaffPadaTanggal(divisi, nama, dateStr, bulanKey) {
            let activeShift = "";
            if (shiftStartData[divisi] && shiftStartData[divisi][nama]) {
                activeShift = shiftStartData[divisi][nama].toUpperCase();
            }

            if (offdayData[bulanKey] && offdayData[bulanKey][nama]) {
                let targetDate = new Date(dateStr);
                let staffRecords = offdayData[bulanKey][nama];
                for (let [dKey, val] of Object.entries(staffRecords)) {
                    if (new Date(dKey) <= targetDate) {
                        if (val === 'CHANGE_SET_MALAM') activeShift = 'MALAM';
                        if (val === 'CHANGE_SET_PAGI') activeShift = 'PAGI';
                    }
                }
            }
            return activeShift || 'PAGI';
        }

        function renderStaffSchedule() {
            const div = staffDivisiLogin.value;
            const nama = staffNamaLogin.value;
            const month = staffFilterBulan.value;

            if (!div || !month) {
                staffScheduleTable.innerHTML = `<tr><td colspan="31" class="py-8 text-slate-500">Silakan pilih divisi terlebih dahulu.</td></tr>`;
                return;
            }

            const [year, mNum] = month.split('-').map(Number);
            const daysInMonth = new Date(year, mNum, 0).getDate();
            const listStaffDivisi = karyawanData[div] || [];

            let html = `<thead><tr class="bg-slate-950 text-yellow-400 font-bold border-b border-yellow-500/30">`;
            html += `<th class="p-2.5 text-left text-yellow-400 sticky left-0 bg-slate-950 z-10 min-w-[200px] border-r border-slate-800">NAMA KARYAWAN</th>`;
            for (let d = 1; d <= daysInMonth; d++) {
                html += `<th class="p-2 text-center text-slate-300 border-r border-slate-800 w-10">${d}</th>`;
            }
            html += `</tr></thead><tbody>`;

            listStaffDivisi.forEach(staffName => {
                let isCurrentLoginStaff = (staffName === nama);
                let rowHighlight = isCurrentLoginStaff ? 'bg-yellow-500/5 font-bold' : '';
                html += `<tr class="border-b border-slate-800/60 ${rowHighlight}">`;
                html += `<td class="p-2.5 text-left text-xs ${isCurrentLoginStaff ? 'text-yellow-400 font-bold' : 'text-slate-300'} sticky left-0 bg-slate-900/95 z-10 border-r border-slate-800 truncate max-w-[200px]" title="${staffName}">${staffName}</td>`;

                let currentActiveShift = "";
                if (shiftStartData[div] && shiftStartData[div][staffName]) {
                    currentActiveShift = shiftStartData[div][staffName].toUpperCase();
                }

                for (let d = 1; d <= daysInMonth; d++) {
                    let dateStr = `${month}-${String(d).padStart(2, '0')}`;
                    let status = "-";
                    let badge = "bg-slate-900/80 text-slate-500";
                    let hasSpecial = false;

                    if (offdayData[month] && offdayData[month][staffName] && offdayData[month][staffName][dateStr]) {
                        let val = offdayData[month][staffName][dateStr];
                        if (val === 'CHANGE_SET_MALAM') { currentActiveShift = 'MALAM'; status = 'CH.MLM'; hasSpecial = true; }
                        else if (val === 'CHANGE_SET_PAGI') { currentActiveShift = 'PAGI'; status = 'CH.PGI'; hasSpecial = true; }
                        else if (val.toUpperCase() === 'CUTI') { status = 'CUTI'; hasSpecial = true; }
                        else if (val.toUpperCase() === 'OFFDAY' || val.toUpperCase() === 'OFF') { status = 'OFF'; hasSpecial = true; }
                    }

                    if (!hasSpecial && currentActiveShift !== "") status = currentActiveShift.substring(0, 4);

                    if (status === 'PAGI' || status === 'CH.PGI') badge = "bg-emerald-950/80 text-emerald-400 border border-emerald-800/50";
                    else if (status === 'MALAM' || status === 'CH.MLM') badge = "bg-blue-950/80 text-blue-400 border border-blue-800/50";
                    else if (status === 'CUTI') badge = "bg-indigo-950/90 text-indigo-300 border border-indigo-800/50 font-bold";
                    else if (status === 'OFF') badge = "bg-red-950/90 text-red-300 border border-red-800/50 font-bold";

                    html += `<td class="p-1 border-r border-slate-800/60 text-center"><div class="rounded py-1 px-0.5 text-[10px] ${badge}">${status}</div></td>`;
                }
                html += `</tr>`;
            });

            html += `</tbody>`;
            staffScheduleTable.innerHTML = html;
        }

        function submitStaffRequest() {
            const div = staffDivisiLogin.value;
            const nama = staffNamaLogin.value;
            const jenis = staffJenisReq.value;

            if (!div || !nama) {
                showStaffAlert("Silakan pilih divisi dan nama staff terlebih dahulu!");
                return;
            }

            if (jenis === 'Offday') {
                const tglVal = staffTanggalReq.value;
                if (!tglVal) {
                    showStaffAlert("Tanggal offday belum dipilih!");
                    return;
                }

                const tglObj = new Date(tglVal);
                const bulanKey = tglVal.substring(0, 7);
                const realNow = new Date();
                const currentMonthKey = realNow.getFullYear() + '-' + String(realNow.getMonth() + 1).padStart(2, '0');
                
                if (bulanKey !== currentMonthKey) {
                    showStaffAlert("PENGAJUAN DITOLAK: Offday mandiri hanya untuk bulan berjalan!");
                    return;
                }

                const tglHari = tglObj.getDate();
                if (tglHari < 8 || tglHari > 29) {
                    showStaffAlert("PENGAJUAN DITOLAK: Offday hanya dapat dilakukan mulai tanggal 8 sampai tanggal 29!");
                    return;
                }

                if (isHariTerakhirBulan(tglVal)) {
                    showStaffAlert("PENGAJUAN DITOLAK: Tidak diizinkan mengambil offday di hari terakhir bulan.");
                    return;
                }

                if (!offdayData[bulanKey]) offdayData[bulanKey] = {};
                if (!offdayData[bulanKey][nama]) offdayData[bulanKey][nama] = {};

                let existingOffdays = Object.entries(offdayData[bulanKey][nama]).filter(([date, val]) => 
                    (val.toUpperCase() === 'OFFDAY' || val.toUpperCase() === 'OFF') && date !== tglVal
                );

                if (existingOffdays.length >= 2) {
                    showStaffAlert("PENGAJUAN DITOLAK: Anda sudah mengambil jatah offday 2 kali bulan ini!");
                    return;
                }

                let targetShiftStaff = getShiftStaffPadaTanggal(div, nama, tglVal, bulanKey);
                for (let staffLain of (karyawanData[div] || [])) {
                    if (staffLain === nama) continue;
                    if (offdayData[bulanKey]?.[staffLain]?.[tglVal]?.toUpperCase() === 'OFF' || offdayData[bulanKey]?.[staffLain]?.[tglVal]?.toUpperCase() === 'OFFDAY') {
                        if (getShiftStaffPadaTanggal(div, staffLain, tglVal, bulanKey) === targetShiftStaff) {
                            showStaffAlert(`PENGAJUAN DITOLAK: Rekan (${staffLain}) shift ${targetShiftStaff} sudah off pada tanggal tersebut.`);
                            return;
                        }
                    }
                }

                offdayData[bulanKey][nama][tglVal] = 'OFFDAY';
                rtdb.ref(`offdayData_v7/${bulanKey}/${nama}`).set(offdayData[bulanKey][nama], (error) => {
                    if (error) showStaffAlert("Gagal mengirim pengajuan.");
                    else {
                        showStaffAlert("BERHASIL: Pengajuan offday disimpan.", 'success');
                        staffTanggalReq.value = '';
                        document.getElementById('staffFilterBulan').value = bulanKey;
                    }
                });

            } else if (jenis === 'Cuti') {
                const tglMulaiStr = staffCutiMulai.value;
                const jumlahHari = parseInt(staffCutiJumlahHari.value) || (div === 'KASIR' ? 12 : 14);

                if (!tglMulaiStr) {
                    showStaffAlert("Tanggal mulai cuti belum dipilih!");
                    return;
                }

                let tglMulai = new Date(tglMulaiStr);
                let updates = {};
                let targetBulanPertama = "";

                for (let i = 0; i < jumlahHari; i++) {
                    let dLoop = new Date(tglMulai);
                    dLoop.setDate(tglMulai.getDate() + i);
                    
                    let thn = dLoop.getFullYear();
                    let bln = String(dLoop.getMonth() + 1).padStart(2, '0');
                    let hari = String(dLoop.getDate()).padStart(2, '0');
                    let dStr = `${thn}-${bln}-${hari}`;
                    let bKey = `${thn}-${bln}`;

                    if (i === 0) targetBulanPertama = bKey;
                    if (!offdayData[bKey]) offdayData[bKey] = {};
                    if (!offdayData[bKey][nama]) offdayData[bKey][nama] = {};

                    offdayData[bKey][nama][dStr] = 'CUTI';
                    updates[`offdayData_v7/${bKey}/${nama}`] = offdayData[bKey][nama];
                }

                rtdb.ref().update(updates, (error) => {
                    if (error) showStaffAlert("Gagal mengirim pengajuan cuti.");
                    else {
                        showStaffAlert(`BERHASIL: Pengajuan cuti otomatis ${jumlahHari} hari tersimpan (mendukung lintas bulan).`, 'success');
                        staffCutiMulai.value = '';
                        document.getElementById('staffFilterBulan').value = targetBulanPertama;
                    }
                });
            }
        }
    </script>
</body>
</html>
