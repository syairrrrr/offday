<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengajuan Offday Staff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body {
            background-image: url('https://demigod-assets.sgp1.cdn.digitaloceanspaces.com/bgassets/goltogel.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .neon-box {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(234, 179, 8, 0.5);
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.3), inset 0 0 15px rgba(234, 179, 8, 0.1);
        }
        .neon-input {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(234, 179, 8, 0.4);
            color: #ffffff;
        }
        .neon-input:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
            outline: none;
        }
        .neon-btn {
            background: linear-gradient(135deg, #d97706, #fbbf24);
            color: #0f172a;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md neon-box rounded-2xl p-6 text-gray-100 backdrop-blur-md">
        
        <h2 class="text-2xl font-bold text-center text-amber-400 mb-6">PENGAJUAN OFFDAY</h2>
        
        <div id="formMessage" class="hidden mb-4 p-3 text-sm rounded-lg"></div>

        <form id="offdayForm" onsubmit="submitOffday(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-amber-300 mb-1">Pilih Email Staff Anda</label>
                <select id="staffEmail" required class="w-full px-4 py-2 rounded-lg neon-input">
                    <option value="" disabled selected>-- Pilih Email Staff --</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-amber-300 mb-1">Pilih Tanggal Offday</label>
                <input type="date" id="offdayDate" required class="w-full px-4 py-2 rounded-lg neon-input">
            </div>

            <div>
                <label class="block text-sm font-medium text-amber-300 mb-1">Keterangan / Alasan</label>
                <textarea id="offdayReason" rows="3" required class="w-full px-4 py-2 rounded-lg neon-input" placeholder="Tuliskan alasan pengajuan..."></textarea>
            </div>

            <button type="submit" class="w-full py-2 rounded-lg font-bold neon-btn">KIRIM PENGAJUAN</button>
        </form>

        <div class="mt-6 pt-4 border-t border-amber-500/30 text-center">
            <a href="admin.html" class="text-xs text-amber-400 hover:underline">🛡️ Masuk ke Panel Admin (Cek Data Offday)</a>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDzGanmCbR1nMYzOr7CzhIlN1E_9lMUzE",
            authDomain: "offday-58776.firebaseapp.com",
            databaseURL: "https://offday-58776-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "offday-58776",
            storageBucket: "offday-58776.firebasestorage.app",
            messagingSenderId: "550746205844",
            appId: "1:550746205844:web:5cd9b900d628f4d612ce81"
        };

        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        // 36 Daftar Email Staff Anda
        const allStaffEmails = [
            "andrewellyanto88.smb88@gmail.com", "idrisidr1366@gmail.com", "martinpangkawira8@gmail.com",
            "roniharianan122@gmail.com", "jekisyahputra.smb888@gmail.com", "dickywijaya03215@gmail.com",
            "bilkisari8678@gmail.com", "anovela290@gmail.com", "panipradeka0356@gmail.com",
            "smudamanik@gmail.com", "muhammadagusalim77@gmail.com", "habirahmad1998@gmail.com",
            "asanjayadamanik@gmail.com", "aisyatunmukarromah034@gmail.com", "hutagalungmuhammadramadan@gmail.com",
            "gustiirwanda125@gmail.com", "jayaokisan797@gmail.com", "raflirinaldi8899@gmail.com",
            "ichaanadaifi88@gmail.com", "wiliaananda53@gmail.com", "adityanugroho251192@gmail.com",
            "muhammadzulfa1603@gmail.com", "diansyahputra45678@gmail.com", "putrinazwaramadhaninasution@gmail.com",
            "irfanrosandy25052024@gmail.com", "oktosuryadi63@gmail.com", "akashviknesh88@gmail.com",
            "aldinofajar005@gmail.com", "weninaalexandrah@gmail.com", "danielsiahaan500@gmail.com",
            "yusufrahman5871@gmail.com", "mestikasafitrisimbolon888@gmail.com", "bulanmeiyanti888@gmail.com",
            "suwadenakas@gmail.com", "yurikanasyiwa345@gmail.com", "ratnasari061023@gmail.com"
        ];

        // Masukkan data email ke dalam dropdown secara otomatis saat halaman dibuka
        const selectDropdown = document.getElementById('staffEmail');
        allStaffEmails.sort().forEach(email => {
            const option = document.createElement('option');
            option.value = email;
            option.textContent = email;
            selectDropdown.appendChild(option);
        });

        // Fungsi kirim pengajuan langsung ke Realtime Database
        window.submitOffday = async function(e) {
            e.preventDefault();
            const email = document.getElementById('staffEmail').value;
            const date = document.getElementById('offdayDate').value;
            const reason = document.getElementById('offdayReason').value;
            const msgDiv = document.getElementById('formMessage');

            try {
                await rtdb.ref('pengajuan_offday').push({
                    email: email,
                    tanggal: date,
                    alasan: reason,
                    status: "Pending",
                    timestamp: Date.now()
                });

                msgDiv.innerText = "Pengajuan offday berhasil dikirim!";
                msgDiv.className = "mb-4 p-3 text-sm rounded-lg bg-green-900/60 border border-green-500 text-green-200";
                msgDiv.classList.remove('hidden');
                document.getElementById('offdayForm').reset();
            } catch (err) {
                msgDiv.innerText = "Gagal mengirim: " + err.message;
                msgDiv.className = "mb-4 p-3 text-sm rounded-lg bg-red-900/60 border border-red-500 text-red-200";
                msgDiv.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
