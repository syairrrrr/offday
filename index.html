<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengajuan Offday Staff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('https://demigod-assets.sgp1.cdn.digitaloceanspaces.com/bgassets/goltogel.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .neon-box {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(234, 179, 8, 0.5);
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.3), inset 0 0 15px rgba(234, 179, 8, 0.1);
        }
        .neon-input {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(234, 179, 8, 0.4);
            color: #ffffff;
        }
        .neon-input:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
            outline: none;
        }
        .neon-btn {
            background: linear-gradient(135deg, #d97706, #fbbf24);
            color: #0f172a;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md neon-box rounded-2xl p-6 text-gray-100 backdrop-blur-md">
        
        <!-- HALAMAN LOGIN -->
        <div id="loginSection">
            <h2 class="text-2xl font-bold text-center text-amber-400 mb-6">LOGIN STAFF</h2>
            <div id="loginError" class="hidden mb-4 p-3 bg-red-900/60 border border-red-500 text-red-200 text-sm rounded-lg"></div>
            
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-amber-300 mb-1">Email</label>
                    <input type="email" id="loginEmail" required class="w-full px-4 py-2 rounded-lg neon-input" placeholder="email@gmail.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-amber-300 mb-1">Password</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-2 rounded-lg neon-input" placeholder="••••••">
                </div>
                <button type="submit" class="w-full py-2 rounded-lg font-bold neon-btn">MASUK</button>
            </form>
        </div>

        <!-- DASHBOARD STAFF -->
        <div id="dashboardSection" class="hidden text-center">
            <h3 class="font-bold text-xl text-amber-300 mb-2">Login Berhasil! 🎉</h3>
            <p id="welcomeEmail" class="text-sm text-gray-300 mb-6"></p>
            <button onclick="handleLogout()" class="w-full py-2 rounded-lg bg-red-600 hover:bg-red-700 font-bold text-white">KELUAR</button>
        </div>

    </div>

    <!-- SCRIPT FIREBASE MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzGanmCbR1nMYzOr7CzhIlN1E_9lMUzE",
            authDomain: "offday-58776.firebaseapp.com",
            projectId: "offday-58776",
            storageBucket: "offday-58776.firebasestorage.app",
            messagingSenderId: "550746205844",
            appId: "1:550746205844:web:5cd9b900d628f4d612ce81"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            errorDiv.classList.add('hidden');

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('welcomeEmail').innerText = "Selamat datang, " + userCredential.user.email;
            } catch (error) {
                errorDiv.innerText = "Gagal login: " + error.message;
                errorDiv.classList.remove('hidden');
            }
        };

        window.handleLogout = async function() {
            await signOut(auth);
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('loginForm').reset();
        };
    </script>
</body>
</html>
