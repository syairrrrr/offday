<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Offday & Cuti Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090a0f;
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('https://demigod-assets.sgp1.cdn.digitaloceanspaces.com/bgassets/goltogel.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .font-mono-code { font-family: 'JetBrains Mono', monospace; }
        .card-container {
            background: rgba(12, 14, 20, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(250, 204, 21, 0.25);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
        }
        .input-pro {
            background: rgba(8, 9, 13, 0.75);
            border: 1px solid rgba(250, 204, 21, 0.3);
            color: #f8fafc;
            transition: all 0.25s ease;
        }
        .input-pro:focus {
            outline: none;
            border-color: #facc15;
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.2);
        }
        .btn-pro {
            background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%);
            color: #090a0f;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-pro:hover {
            filter: brightness(1.1);
            box-shadow: 0 4px 15px rgba(250, 204, 21, 0.35);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(9, 10, 15, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(250, 204, 21, 0.3); border-radius: 3px; }
    </style>
</head>
<body class="antialiased">

    <div class="max-w-[98%] mx-auto px-4 py-6">
        <header class="mb-6">
            <div class="card-container rounded-xl px-6 py-3 flex flex-wrap justify-between items-center gap-4 mb-4">
                <div class="flex items-center space-x-3">
                    <span class="w-3 h-3 bg-yellow-400 rounded-full animate-pulse"></span>
                    <span class="text-xs font-mono-code tracking-wider text-yellow-400 uppercase font-bold">ADMIN DASHBOARD: OFFDAY & CUTI MANAGEMENT (CS, KAPTEN, KASIR)</span>
                </div>
                <div class="flex items-center gap-4 text-xs font-mono-code text-slate-300">
                    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-red-600 rounded-sm"></span> OFFDAY</span>
                    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-indigo-600 rounded-sm"></span> CUTI</span>
                    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-emerald-600 rounded-sm"></span> PAGI</span>
                    <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-blue-600 rounded-sm"></span> MALAM</span>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-1 space-y-4">
                <div class="card-container rounded-xl p-5 sticky top-6">
                    <div class="flex items-center justify-between pb-3 mb-4 border-b border-yellow-500/20">
                        <h2 class="text-sm font-bold tracking-wide text-yellow-400 font-mono-code uppercase" id="formPanelTitle">Panel Kontrol Admin</h2>
                    </div>

                    <form id="offdayForm" class="space-y-4 text-xs font-mono-code">
                        <div>
                            <label class="block font-semibold mb-1 text-slate-200">JENIS INPUT</label>
                            <select id="jenisInput" required class="w-full px-3 py-2.5 rounded-lg input-pro text-xs" onchange="toggleJenisInput()">
                                <option value="Offday" class="bg-slate-900">Pengajuan Offday</option>
                                <option value="Cuti" class="bg-slate-900">Pengajuan Cuti (Otomatis Beruntun)</option>
                                <option value="ShiftStart" class="bg-slate-900">Set Shift Berkelanjutan</option>
                                <option value="Change" class="bg-slate-900">Change Shift</option>
                            </select>
                        </div>

                        <div>
                            <label class="block font-semibold mb-1 text-slate-200">DIVISI</label>
                            <select id="divisi" required class="w-full px-3 py-2.5 rounded-lg input-pro text-xs" onchange="updateKaryawanList()">
                                <option value="" class="bg-slate-900">-- Pilih Divisi --</option>
                                <option value="CS" class="bg-slate-900">Customer Service (CS)</option>
                                <option value="KAPTEN" class="bg-slate-900">Kapten</option>
                                <option value="KASIR" class="bg-slate-900">Kasir</option>
                            </select>
                        </div>

                        <div>
                            <label class="block font-semibold mb-1 text-slate-200">NAMA KARYAWAN</label>
                            <select id="nama" required class="w-full px-3 py-2.5 rounded-lg input-pro text-xs">
                                <option value="" class="bg-slate-900">-- Pilih Divisi Terlebih Dahulu --</option>
                            </select>
                        </div>

                        <div id="tanggalGroup">
                            <label class="block font-semibold mb-1 text-slate-200" id="labelTanggal">TANGGAL OFFDAY</label>
                            <input type="date" id="tanggal" required class="w-full px-3 py-2.5 rounded-lg input-pro text-xs cursor-pointer">
                        </div>

                        <div id="jumlahCutiGroup" class="hidden">
                            <label class="block font-semibold mb-1 text-slate-200">JUMLAH HARI CUTI BERUNTUN</label>
                            <input type="number" id="jumlahCuti" min="1" max="31" value="12" class="w-full px-3 py-2.5 rounded-lg input-pro text-xs">
                        </div>

                        <div id="shiftGroup">
                            <label class="block font-semibold mb-1 text-slate-200" id="labelShift">SHIFT</label>
                            <select id="shift" required class="w-full px-3 py-2.5 rounded-lg input-pro text-xs">
                                <option value="" class="bg-slate-900">-- Pilih Shift --</option>
                                <option value="Pagi" class="bg-slate-900">Pagi</option>
                                <option value="Malam" class="bg-slate-900">Malam</option>
                            </select>
                        </div>

                        <div class="flex gap-2">
                            <button type="submit" id="btnSubmitForm" class="flex-1 py-3 px-4 rounded-lg btn-pro tracking-wider uppercase text-xs font-bold shadow-lg mt-2">
                                PROSES DATA ADMIN
                            </button>
                            <button type="button" id="btnCancelEdit" onclick="cancelEditMode()" class="hidden py-3 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 tracking-wider uppercase text-xs font-bold shadow-lg mt-2">
                                Batal
                            </button>
                        </div>
                    </form>
                    
                    <div id="alertBox" class="mt-4 hidden p-3 rounded-lg text-xs font-mono-code"></div>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-4">
                <div class="card-container rounded-xl p-4 flex flex-wrap justify-between items-center gap-4 font-mono-code text-xs">
                    <div class="flex flex-wrap items-center gap-4">
                        <div>
                            <label class="font-semibold block mb-1 text-slate-300">PERIODE BULAN:</label>
                            <input type="month" id="filterBulan" class="px-3 py-2 rounded-lg input-pro text-xs font-mono-code" onchange="renderMatrix()">
                        </div>
                        <div>
                            <label class="font-semibold block mb-1 text-slate-300">FILTER DIVISI:</label>
                            <select id="filterDivisi" class="px-3 py-2 rounded-lg input-pro text-xs font-mono-code" onchange="renderMatrix()">
                                <option value="CS" class="bg-slate-900">Customer Service (CS)</option>
                                <option value="KAPTEN" class="bg-slate-900">Kapten</option>
                                <option value="KASIR" class="bg-slate-900">Kasir</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="card-container rounded-xl overflow-hidden">
                    <div class="px-6 py-4 border-b border-yellow-500/20 flex justify-between items-center flex-wrap gap-3 font-mono-code">
                        <h2 class="text-sm font-bold tracking-wide text-yellow-400 uppercase">Rekapitulasi Shift & Status Bulanan</h2>
                    </div>
                    
                    <div class="overflow-x-auto max-h-[620px]">
                        <table id="matrixTable" class="w-full text-left border-collapse text-[11px] font-mono-code whitespace-nowrap">
                            </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCoYy_QgZ4i7NeWHkLGhcicJRDFEITzxLM",
            authDomain: "offday-cebb2.firebaseapp.com",
            databaseURL: "https://offday-cebb2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "offday-cebb2",
            storageBucket: "offday-cebb2.firebasestorage.app",
            messagingSenderId: "700101138134",
            appId: "1:700101138134:web:6b952e04c91d20287ddb77",
            measurementId: "G-42TCRY5BSH"
        };

        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        const now = new Date();
        const currentYearMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('filterBulan').value = currentYearMonth;

        const karyawanData = {
            "CS": [
                "ANDRE WELLYANTO", "MARTIN PANGKAWIRA", "DICKY WIJAYA", 
                "MUHAMMAD RAMADAN HUTAGALUNG", "JEKI SYAHPUTRA GINTING", 
                "AISYATUN MUKARROMAH", "PANI PRADENKA", "BILKIS ARI ADI NANTA", 
                "IDRIS", "RONI HARI ANAN", "MUHAMMAD AGUS SALIM", 
                "HABI RAHMAD", "SANDRES MUDA MANIK", "ANDRE NOVELA", 
                "AGUS ANGGARA SANJAYA DAMANIK"
            ],
            "KAPTEN": [
                "ICHA ANANDA ISFI", "RAFLI RINALDI", "GUSTI IRWANDA", "OKI SAN JAYA"
            ],
            "KASIR": [
                "MUHAMMAD ZULFA", "DANIEL SIAHAAN", "DIAN SYAHPUTRA", 
                "OKTO SURYADI", "WENINA ALEXANDRA HUTABARAT", "AKASH VIKNESH", 
                "WILIA ANANDA", "PUTRI NAZWA NASUTION", "IRFAN ROSANDY NASUTION", 
                "ADITYA NUGROHO", "AKAS SUWADEN", "BULAN MEI YANTI", 
                "RATNA SARI", "YUSUF RAHMAN", "YURIKA NASYIWA", 
                "ALDINO FAJAR", "MESTIKA SAFITRI SIMBOLON"
            ]
        };

        let offdayData = {};
        let shiftStartData = {}; 

        const form = document.getElementById('offdayForm');
        const jenisInput = document.getElementById('jenisInput');
        const divisiSelect = document.getElementById('divisi');
        const namaSelect = document.getElementById('nama');
        const tanggalGroup = document.getElementById('tanggalGroup');
        const labelTanggal = document.getElementById('labelTanggal');
        const tanggalInput = document.getElementById('tanggal');
        const jumlahCutiGroup = document.getElementById('jumlahCutiGroup');
        const jumlahCutiInput = document.getElementById('jumlahCuti');
        const shiftGroup = document.getElementById('shiftGroup');
        const labelShift = document.getElementById('labelShift');
        const shiftSelect = document.getElementById('shift');
        const alertBox = document.getElementById('alertBox');
        const filterDivisi = document.getElementById('filterDivisi');
        const filterBulan = document.getElementById('filterBulan');
        const matrixTable = document.getElementById('matrixTable');
        const formPanelTitle = document.getElementById('formPanelTitle');
        const btnSubmitForm = document.getElementById('btnSubmitForm');
        const btnCancelEdit = document.getElementById('btnCancelEdit');

        rtdb.ref('offdayData_v7').on('value', (snapshot) => {
            offdayData = snapshot.val() || {};
            renderMatrix();
        });

        rtdb.ref('shiftStart_v7').on('value', (snapshot) => {
            shiftStartData = snapshot.val() || {};
            renderMatrix();
        });

        function toggleJenisInput() {
            const val = jenisInput.value;
            jumlahCutiGroup.classList.add('hidden');
            if (val === 'ShiftStart') {
                tanggalGroup.classList.remove('hidden');
                tanggalInput.setAttribute('required', 'true');
                labelTanggal.textContent = "TANGGAL MULAI SHIFT";
                shiftGroup.classList.remove('hidden');
                labelShift.textContent = "SHIFT AWAL (Pagi/Malam)";
                shiftSelect.setAttribute('required', 'true');
                shiftSelect.innerHTML = `
                    <option value="" class="bg-slate-900">-- Pilih Shift --</option>
                    <option value="Pagi" class="bg-slate-900">Pagi</option>
                    <option value="Malam" class="bg-slate-900">Malam</option>
                `;
            } else if (val === 'Change') {
                tanggalGroup.classList.remove('hidden');
                tanggalInput.setAttribute('required', 'true');
                labelTanggal.textContent = "TANGGAL MULAI CHANGE";
                shiftGroup.classList.remove('hidden');
                labelShift.textContent = "JENIS CHANGE SHIFT";
                shiftSelect.innerHTML = `
                    <option value="" class="bg-slate-900">-- Pilih Change Shift --</option>
                    <option value="Change Malam" class="bg-slate-900">Change Malam (Seterusnya Malam)</option>
                    <option value="Change Pagi" class="bg-slate-900">Change Pagi (Seterusnya Pagi)</option>
                `;
                shiftSelect.setAttribute('required', 'true');
            } else if (val === 'Cuti') {
                tanggalGroup.classList.remove('hidden');
                tanggalInput.setAttribute('required', 'true');
                labelTanggal.textContent = "TANGGAL MULAI CUTI";
                jumlahCutiGroup.classList.remove('hidden');
                shiftGroup.classList.add('hidden');
                shiftSelect.removeAttribute('required');
            } else { 
                tanggalGroup.classList.remove('hidden');
                tanggalInput.setAttribute('required', 'true');
                labelTanggal.textContent = "TANGGAL OFFDAY";
                shiftGroup.classList.remove('hidden');
                labelShift.textContent = "SHIFT OFFDAY";
                shiftSelect.innerHTML = `
                    <option value="" class="bg-slate-900">-- Pilih Shift --</option>
                    <option value="Pagi" class="bg-slate-900">Pagi</option>
                    <option value="Malam" class="bg-slate-900">Malam</option>
                `;
                shiftSelect.setAttribute('required', 'true');
            }
        }

        function updateKaryawanList() {
            const selectedDivisi = divisiSelect.value;
            namaSelect.innerHTML = '<option value="">-- Pilih Karyawan --</option>';
            if (selectedDivisi && karyawanData[selectedDivisi]) {
                karyawanData[selectedDivisi].forEach(nama => {
                    const option = document.createElement('option');
                    option.value = nama;
                    option.textContent = nama;
                    option.className = "bg-slate-900";
                    namaSelect.appendChild(option);
                });
            }
        }

        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.classList.remove('hidden', 'bg-red-950/80', 'text-red-300', 'border-red-600', 'bg-emerald-950/80', 'text-emerald-300', 'border-emerald-600');
            if (type === 'error') {
                alertBox.classList.add('bg-red-950/80', 'text-red-300', 'border', 'border-red-600');
            } else {
                alertBox.classList.add('bg-emerald-950/80', 'text-emerald-300', 'border', 'border-emerald-600');
            }
            setTimeout(() => { alertBox.classList.add('hidden'); }, 5000);
        }

        function renderMatrix() {
            const selectedDivisi = filterDivisi.value;
            const selectedMonth = filterBulan.value;
            if (!selectedMonth) return;

            const [year, month] = selectedMonth.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();
            const staffList = karyawanData[selectedDivisi] || [];

            let headerHTML = `<thead><tr class="bg-slate-950/80 text-yellow-400 font-bold border-b border-yellow-500/30 text-center">`;
            headerHTML += `<th class="px-4 py-3 text-left sticky left-0 bg-[#0c0e14]/90 z-10 min-w-[200px]">NAMA KARYAWAN</th>`;
            for (let d = 1; d <= daysInMonth; d++) {
                headerHTML += `<th class="px-2 py-3 min-w-[42px] text-center text-slate-200">${d}</th>`;
            }
            headerHTML += `<th class="px-4 py-3 text-center sticky right-0 bg-[#0c0e14]/90 z-10 min-w-[90px]">AKSI</th>`;
            headerHTML += `</tr></thead>`;

            let bodyHTML = `<tbody class="divide-y divide-slate-800/50">`;
            
            if (staffList.length === 0) {
                bodyHTML += `<tr><td colspan="${daysInMonth + 2}" class="text-center py-4 text-slate-400">Tidak ada data karyawan.</td></tr>`;
            } else {
                staffList.forEach(nama => {
                    bodyHTML += `<tr>`;
                    bodyHTML += `<td class="px-4 py-2.5 font-semibold text-slate-100 sticky left-0 bg-[#0c0e14]/90 z-10">${nama}</td>`;

                    let currentActiveShift = "";
                    if (shiftStartData[selectedDivisi] && shiftStartData[selectedDivisi][nama]) {
                        currentActiveShift = shiftStartData[selectedDivisi][nama].toUpperCase();
                    }

                    for (let d = 1; d <= daysInMonth; d++) {
                        let dateStr = `${selectedMonth}-${String(d).padStart(2, '0')}`;
                        let status = "-";
                        let displayText = "-";
                        let badgeClass = "bg-slate-800/50 text-slate-400";

                        let hasSpecialStatus = false;
                        if (offdayData[selectedMonth] && offdayData[selectedMonth][nama] && offdayData[selectedMonth][nama][dateStr]) {
                            let valData = offdayData[selectedMonth][nama][dateStr];
                            
                            if (valData === 'CHANGE_SET_MALAM') {
                                currentActiveShift = 'MALAM';
                                status = 'MALAM';
                                displayText = 'CH.MLM';
                                hasSpecialStatus = true;
                            } else if (valData === 'CHANGE_SET_PAGI') {
                                currentActiveShift = 'PAGI';
                                status = 'PAGI';
                                displayText = 'CH.PGI';
                                hasSpecialStatus = true;
                            } else if (valData.toUpperCase() === 'CUTI') {
                                status = 'CUTI';
                                displayText = 'CUTI';
                                hasSpecialStatus = true;
                            } else if (valData.toUpperCase() === 'OFFDAY' || valData.toUpperCase() === 'OFF') {
                                status = 'OFF';
                                displayText = 'OFF';
                                hasSpecialStatus = true;
                            } else {
                                status = valData.toUpperCase();
                                displayText = status.substring(0, 4);
                                hasSpecialStatus = true;
                            }
                        }

                        if (!hasSpecialStatus && currentActiveShift !== "") {
                            status = currentActiveShift;
                            displayText = status.substring(0, 4);
                        }

                        if (status === 'PAGI') {
                            badgeClass = hasSpecialStatus ? "bg-emerald-900/90 text-emerald-300 border border-emerald-500 font-bold" : "bg-emerald-900/50 text-emerald-400/80";
                        } else if (status === 'MALAM') {
                            badgeClass = hasSpecialStatus ? "bg-blue-900/90 text-blue-300 border border-blue-500 font-bold" : "bg-blue-950/50 text-blue-400/80";
                        } else if (status === 'CUTI') {
                            badgeClass = "bg-indigo-950/90 text-indigo-300 border border-indigo-500 font-bold";
                        } else if (status === 'OFF') {
                            badgeClass = "bg-red-950/90 text-red-300 border border-red-500 font-bold";
                        }

                        bodyHTML += `<td class="p-1 text-center cursor-pointer" onclick="pilihTanggalLangsung('${selectedDivisi}', '${nama}', '${dateStr}')" title="Klik untuk ubah ${nama} tgl ${d}">
                            <div class="rounded py-1.5 px-0.5 text-[9.5px] font-bold ${badgeClass} hover:ring-2 hover:ring-yellow-400 transition">
                                ${displayText}
                            </div>
                        </td>`;
                    }

                    bodyHTML += `<td class="px-4 py-2.5 text-center sticky right-0 bg-[#0c0e14]/90 z-10">
                        <button onclick="resetJadwalStaff('${selectedDivisi}', '${nama}')" class="px-2.5 py-1 bg-red-700 hover:bg-red-600 text-white text-[11px] font-bold rounded transition shadow" title="Reset semua jadwal khusus ${nama} bulan ini">Reset</button>
                    </td>`;

                    bodyHTML += `</tr>`;
                });
            }

            bodyHTML += `</tbody>`;
            matrixTable.innerHTML = headerHTML + bodyHTML;
        }

        function resetJadwalStaff(divisi, nama) {
            const selectedMonth = filterBulan.value;
            if (!confirm(`Apakah Anda yakin ingin mereset/menghapus semua jadwal khusus (offday/cuti/change shift) untuk ${nama} pada bulan ${selectedMonth}?`)) {
                return;
            }

            rtdb.ref(`offdayData_v7/${selectedMonth}/${nama}`).remove((error) => {
                if (error) {
                    showAlert("Gagal mereset jadwal staff.");
                } else {
                    showAlert(`BERHASIL: Jadwal ${nama} pada bulan ${selectedMonth} telah direset.`, 'success');
                }
            });
        }

        function bukaFormUbah(divisi, nama) {
            filterDivisi.value = divisi;
            divisiSelect.value = divisi;
            updateKaryawanList();
            namaSelect.value = nama;

            formPanelTitle.textContent = `Ubah Jadwal: ${nama}`;
            btnSubmitForm.textContent = "SIMPAN PERUBAHAN";
            btnCancelEdit.classList.remove('hidden');
            form.scrollIntoView({ behavior: 'smooth' });
        }

        function pilihTanggalLangsung(divisi, nama, dateStr) {
            bukaFormUbah(divisi, nama);
            tanggalInput.value = dateStr;
            showAlert(`Mode Edit: Karyawan ${nama} untuk tanggal ${dateStr} dipilih.`, 'success');
        }

        function cancelEditMode() {
            form.reset();
            document.getElementById('filterBulan').value = currentYearMonth;
            formPanelTitle.textContent = "Panel Kontrol Admin";
            btnSubmitForm.textContent = "PROSES DATA ADMIN";
            btnCancelEdit.classList.add('hidden');
            toggleJenisInput();
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const typeInput = jenisInput.value;
            const divisi = divisiSelect.value;
            const nama = namaSelect.value;
            const tglVal = tanggalInput.value; 
            const shiftVal = shiftSelect.value;

            if (!divisi || !nama) {
                showAlert("Harap pilih divisi dan nama karyawan!");
                return;
            }

            const bulanKey = tglVal ? tglVal.substring(0, 7) : currentYearMonth;

            if (typeInput === 'ShiftStart') {
                rtdb.ref(`shiftStart_v7/${divisi}/${nama}`).set(shiftVal, (error) => {
                    if (error) showAlert("Gagal menyimpan shift awal.");
                    else {
                        showAlert(`BERHASIL: Shift awal ${nama} diatur ke ${shiftVal}.`, 'success');
                        cancelEditMode();
                    }
                });
            } else if (typeInput === 'Change') {
                if (!offdayData[bulanKey]) offdayData[bulanKey] = {};
                if (!offdayData[bulanKey][nama]) offdayData[bulanKey][nama] = {};

                let targetVal = shiftVal === 'Change Malam' ? 'CHANGE_SET_MALAM' : 'CHANGE_SET_PAGI';
                offdayData[bulanKey][nama][tglVal] = targetVal;

                rtdb.ref(`offdayData_v7/${bulanKey}/${nama}`).set(offdayData[bulanKey][nama], (error) => {
                    if (error) showAlert("Gagal memproses change shift.");
                    else {
                        showAlert(`BERHASIL: Change shift ${nama} tersimpan.`, 'success');
                        cancelEditMode();
                    }
                });
            } else if (typeInput === 'Cuti') {
                const totalHariCuti = parseInt(jumlahCutiInput.value) || 12;
                if (!offdayData[bulanKey]) offdayData[bulanKey] = {};
                if (!offdayData[bulanKey][nama]) offdayData[bulanKey][nama] = {};

                // Loop secara otomatis beruntun sebanyak X hari dari tanggal mulai cuti
                let startDate = new Date(tglVal);
                for (let i = 0; i < totalHariCuti; i++) {
                    let dLoop = new Date(startDate);
                    dLoop.setDate(startDate.getDate() + i);
                    
                    let y = dLoop.getFullYear();
                    let m = String(dLoop.getMonth() + 1).padStart(2, '0');
                    let d = String(dLoop.getDate()).padStart(2, '0');
                    let loopDateStr = `${y}-${m}-${d}`;
                    let loopBulanKey = `${y}-${m}`;

                    if (!offdayData[loopBulanKey]) offdayData[loopBulanKey] = {};
                    if (!offdayData[loopBulanKey][nama]) offdayData[loopBulanKey][nama] = {};

                    offdayData[loopBulanKey][nama][loopDateStr] = 'CUTI';
                }

                // Kirim semua perubahan bulan yang terkena dampak cuti beruntun ke Firebase
                let updates = {};
                for (let bKey in offdayData) {
                    if (offdayData[bKey][nama]) {
                        updates[`offdayData_v7/${bKey}/${nama}`] = offdayData[bKey][nama];
                    }
                }

                rtdb.ref().update(updates, (error) => {
                    if (error) showAlert("Gagal memproses cuti beruntun.");
                    else {
                        showAlert(`BERHASIL: Cuti beruntun selama ${totalHariCuti} hari untuk ${nama} berhasil disimpan.`, 'success');
                        cancelEditMode();
                    }
                });
            } else { // Offday
                if (!offdayData[bulanKey]) offdayData[bulanKey] = {};
                if (!offdayData[bulanKey][nama]) offdayData[bulanKey][nama] = {};

                offdayData[bulanKey][nama][tglVal] = 'OFFDAY';

                rtdb.ref(`offdayData_v7/${bulanKey}/${nama}`).set(offdayData[bulanKey][nama], (error) => {
                    if (error) showAlert("Gagal memproses offday.");
                    else {
                        showAlert(`BERHASIL: Offday untuk ${nama} berhasil disimpan.`, 'success');
                        cancelEditMode();
                    }
                });
            }
        });
    </script>
</body>
</html>
