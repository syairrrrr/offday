<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Kelola Offday Staff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-700">
            <h1 class="text-2xl font-bold text-amber-400">🛡️ Panel Admin - Daftar Pengajuan Offday</h1>
            <a href="index.html" class="text-sm text-amber-300 hover:underline">← Ke Halaman Login Staff</a>
        </div>

        <div class="overflow-x-auto bg-slate-900 border border-amber-500/30 rounded-xl p-4 shadow-xl">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-gray-700 text-amber-300 text-sm">
                        <th class="p-3">Email Staff</th>
                        <th class="p-3">Tanggal Offday</th>
                        <th class="p-3">Alasan</th>
                        <th class="p-3">Status</th>
                        <th class="p-3 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody" class="text-sm">
                    <tr><td colspan="5" class="p-4 text-center text-gray-400">Memuat data pengajuan...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDzGanmCbR1nMYzOr7CzhIlN1E_9lMUzE",
            authDomain: "offday-58776.firebaseapp.com",
            databaseURL: "https://offday-58776-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "offday-58776",
            storageBucket: "offday-58776.firebasestorage.app",
            messagingSenderId: "550746205844",
            appId: "1:550746205844:web:5cd9b900d628f4d612ce81"
        };

        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        function loadAllPengajuan() {
            const ref = rtdb.ref('pengajuan_offday');
            ref.on('value', (snapshot) => {
                const tbody = document.getElementById('adminTableBody');
                tbody.innerHTML = "";

                if (!snapshot.exists()) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">Belum ada pengajuan offday.</td></tr>`;
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const id = childSnapshot.key;
                    const data = childSnapshot.val();

                    let statusBadge = `<span class="px-2 py-1 bg-yellow-900/50 text-yellow-300 border border-yellow-500 rounded text-xs font-semibold">Pending</span>`;
                    if (data.status === 'Disetujui') {
                        statusBadge = `<span class="px-2 py-1 bg-green-900/50 text-green-300 border border-green-500 rounded text-xs font-semibold">Disetujui</span>`;
                    } else if (data.status === 'Ditolak') {
                        statusBadge = `<span class="px-2 py-1 bg-red-900/50 text-red-300 border border-red-500 rounded text-xs font-semibold">Ditolak</span>`;
                    }

                    const row = `
                        <tr class="border-b border-gray-800 hover:bg-slate-800/50">
                            <td class="p-3 text-amber-200">${data.email}</td>
                            <td class="p-3">${data.tanggal}</td>
                            <td class="p-3 text-gray-300">${data.alasan}</td>
                            <td class="p-3">${statusBadge}</td>
                            <td class="p-3 text-center space-x-2">
                                <button onclick="updateStatus('${id}', 'Disetujui')" class="px-3 py-1 bg-green-600 hover:bg-green-700 text-white rounded text-xs font-bold">Setujui</button>
                                <button onclick="updateStatus('${id}', 'Ditolak')" class="px-3 py-1 bg-red-600 hover:bg-red-700 text-white rounded text-xs font-bold">Tolak</button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            });
        }

        window.updateStatus = async function(id, status) {
            try {
                await rtdb.ref('pengajuan_offday/' + id).update({ status: status });
            } catch (err) {
                alert("Gagal mengubah status: " + err.message);
            }
        };

        loadAllPengajuan();
    </script>
</body>
</html>
